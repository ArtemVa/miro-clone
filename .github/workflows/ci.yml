name: CI

on:
  pull_request:
    branches: [dev, main]

# Новый пуш в PR отменяет прошлый прогон
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Тесты api работают с настоящей базой app_test (адрес — в apps/api/vitest.config.ts)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # --affected сравнивает PR с базовой веткой, для этого нужна история
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - name: Проверки затронутых пакетов
        run: pnpm turbo run lint typecheck test build --affected
        env:
          # По умолчанию turbo сравнивает с main, а PR у нас идут и в dev
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
