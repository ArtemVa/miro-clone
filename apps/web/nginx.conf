# Фронт, api и WebSocket на одном адресе: браузеру не нужен CORS, cookie общие.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # По умолчанию nginx закрывает соединение, если 60 секунд не было данных
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # У файлов из /assets хэш в имени, их можно кэшировать надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: все остальные пути отдаёт index.html, дальше разбирается роутер фронта
    location / {
        try_files $uri $uri/ /index.html;
    }
}
