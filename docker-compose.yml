# Локальная инфраструктура для разработки.
# Запуск: docker compose up -d    Остановка: docker compose stop
# Удалить вместе с данными БД: docker compose down -v
#
# Значения по умолчанию можно переопределить в файле .env рядом с этим файлом,
# например POSTGRES_PORT=5433, если 5432 уже занят. Тогда поменяйте порт и в apps/api/.env.
# Остальные порты: REDIS_PORT, MINIO_PORT, MINIO_CONSOLE_PORT, APP_PORT.
#
# Всё приложение в контейнерах (миграции, api, фронт с nginx):
#   docker compose --profile app up -d --build    затем http://localhost:8080

name: miro-clone

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Только localhost: база не должна быть видна из сети
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # С Postgres 18 данные лежат в /var/lib/postgresql/18/docker, volume монтируется на уровень выше
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-хранилище для файлов. Официальные образы MinIO удалены с Docker Hub,
  # поэтому берём сборку сообщества pgsty/minio.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # 9000: S3 API, 9001: веб-консоль
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый контейнер: создаёт бакет, если его нет, и завершается
  minio-init:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-app}
    entrypoint: ['sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$MINIO_BUCKET"

  # Дальше сервисы профиля app. Без --profile app они не запускаются.

  # Одноразовый контейнер: применяет миграции и завершается. api стартует после него.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # nginx: отдаёт фронт и проксирует /api и /ws на api
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
